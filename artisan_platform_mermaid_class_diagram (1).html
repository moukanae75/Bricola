
<div id="diagram" style="padding:1rem 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    classText: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2e2b4a' : '#EEEDFE',
    primaryBorderColor: dark ? '#7F77DD' : '#534AB7',
    primaryTextColor: dark ? '#CECBF6' : '#26215C',
    secondaryColor: dark ? '#1a3328' : '#E1F5EE',
    secondaryBorderColor: dark ? '#1D9E75' : '#0F6E56',
    tertiaryColor: dark ? '#3a1c0e' : '#FAECE7',
    tertiaryBorderColor: dark ? '#D85A30' : '#993C1D',
    noteBkgColor: dark ? '#2a2a28' : '#F1EFE8',
    noteBorderColor: dark ? '#5F5E5A' : '#B4B2A9',
  },
});

const diagram = `classDiagram
  direction TB

  class User {
    <<abstract>>
    - id : Integer
    - name : String
    - email : String
    - passwordHash : String
    - phone : String
    + register() void
    + login(email, pwd) Boolean
  }

  class Client {
    - address : String
    - city : String
    - profilePhoto : String
    - createdAt : Date
    + submitServiceRequest() void
    + viewArtisanProfile() void
    + leaveEvaluation() void
  }

  class Artisan {
    - bio : String
    - city : String
    - averageRating : Float
    - isVerified : Boolean
    - portfolio : String
    - registeredAt : Date
    + acceptRequest(requestId) void
    + declineRequest(requestId) void
    + updateStatus(status) void
    + proposeSkill(name) void
  }

  class Admin {
    - adminLevel : Integer
    - lastLoginAt : Date
    + approveCategory(id) void
    + rejectCategory(id) void
    + verifyArtisan(id) void
    + generateReport() Report
    + suspendUser(id) void
  }

  class ServiceRequest {
    - id : Integer
    - title : String
    - description : String
    - status : ServiceStatus
    - location : String
    - requestedAt : Date
    - scheduledAt : Date
    + cancel() void
    + attachMedia(file) void
    + getStatus() ServiceStatus
  }

  class Category {
    - id : Integer
    - name : String
    - isApproved : Boolean
    - isPending : Boolean
    + approve() void
    + reject() void
    + markPending() void
  }

  class Evaluation {
    - id : Integer
    - rating : Integer
    - comment : String
    - submittedAt : Date
    - isVisible : Boolean
    + submit() void
    + computeArtisanAvg() Float
  }

  class Media {
    - id : Integer
    - fileUrl : String
    - type : MediaType
    - uploadedAt : Date
    + getUrl() String
  }

  class Report {
    - id : Integer
    - generatedAt : Date
    - type : ReportType
    - content : String
    + export(format) File
  }

  class ServiceStatus {
    <<enumeration>>
    PENDING
    ACCEPTED
    IN_PROGRESS
    COMPLETED
    CANCELLED
    DECLINED
  }

  class MediaType {
    <<enumeration>>
    IMAGE
    VIDEO
    DOCUMENT
  }

  class ReportType {
    <<enumeration>>
    USERS_SUMMARY
    SERVICES_SUMMARY
    EVALUATIONS_SUMMARY
  }

  User <|-- Client
  User <|-- Artisan
  User <|-- Admin

  Client "1" --> "*" ServiceRequest : submits
  Artisan "1" --> "*" ServiceRequest : handles
  Artisan "*" o-- "*" Category : has skills in
  Admin ..> Category : manages
  Admin ..> Report : generates

  ServiceRequest "*" o-- "1" Category : belongs to
  ServiceRequest "1" *-- "*" Media : contains
  ServiceRequest ..> ServiceStatus : uses

  Client "1" --> "*" Evaluation : writes
  Evaluation "1" --> "1" ServiceRequest : references
  Media ..> MediaType : uses
  Report ..> ReportType : uses
`;

const { svg } = await mermaid.render('mermaid-class', diagram);
document.getElementById('diagram').innerHTML = svg;

const svgEl = document.querySelector('#diagram svg');
if (svgEl) {
  svgEl.style.width = '100%';
  svgEl.style.height = 'auto';
  svgEl.style.maxWidth = '100%';
}
</script>
