
<style>
#cd { width: 100%; overflow-x: auto; padding: 8px 0; }
#cd svg { min-width: 900px; font-family: "Anthropic Sans", sans-serif !important; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 4px; padding: 8px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: 8px; }
.leg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-secondary); }
.leg-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
</style>
<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:#5b4ead"></div>PHP — Client web app</div>
  <div class="leg-item"><div class="leg-dot" style="background:#2d7d5a"></div>Java — Admin app</div>
  <div class="leg-item"><div class="leg-dot" style="background:#a05c10"></div>C++ — Artisan CLI</div>
  <div class="leg-item"><div class="leg-dot" style="background:#1a6fa8"></div>Python — Mini chat app</div>
  <div class="leg-item"><div class="leg-dot" style="background:#888"></div>Shared domain entities</div>
</div>
<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a40' : '#eeedfe',
    primaryBorderColor: dark ? '#534AB7' : '#534AB7',
    secondaryColor: dark ? '#1a2e24' : '#e1f5ee',
    tertiaryColor: dark ? '#2c1e0a' : '#faeeda',
    classText: dark ? '#c2c0b6' : '#1a1a1a',
  },
});

const diagram = `classDiagram
  direction TB

  %% ─────────────────── DOMAIN ENTITIES ───────────────────
  class Client {
    -int id_client
    -String nom_client
    -String email_client
    -String mot_de_passe_client
    -String telephone_client
    -String adresse
    -String ville
    -Date date_inscription
    +register() void
    +login() bool
    +logout() void
    +browseServices() List~Desservice~
    +submitDemande(desc: String, type: String) Demande
    +trackDemandeStatus(id: int) String
    +payDemande(id: int, method: String) Paiement
    +leaveEvaluation(note: int, comment: String) Evaluation
    +viewRepairs() List~Reparation~
    +viewHistory() List~Demande~
  }

  class Artisan {
    -int id_artisan
    -String nom_artisan
    -String email_artisan
    -String mot_de_passe_artisan
    -String telephone_artisan
    -String adresse
    -String ville
    -bool dispo_artisan
    +loginCLI() bool
    +viewAssignedDemandes() List~Demande~
    +updateAvailability(dispo: bool) void
    +acceptDemande(id: int) void
    +refuseDemande(id: int) void
    +logReparationDetails(desc: String, cout: float) Reparation
    +markReparationComplete(id: int) void
    +viewOwnEvaluations() List~Evaluation~
    +updateWorkProgress(id: int, status: String) void
  }

  class Administrateur {
    -int id_admin
    -String nom_admin
    -String email_admin
    -String mot_de_passe_admin
    -String telephone_admin
    +loginDashboard() bool
    +manageArtisans() List~Artisan~
    +manageServices() List~Desservice~
    +viewAllDemandes() List~Demande~
    +assignArtisanToDemande(idD: int, idA: int) void
    +viewRapportFinancier() RapportFinancier
    +monitorEvaluations() List~Evaluation~
    +managePayments() List~Paiement~
    +generateRapport(start: Date, end: Date) RapportFinancier
  }

  class Demande {
    -int id_demande
    -Date date_creation_demande
    -String statut
    -String type_demande
    -String description_demande
    -int fk_client
    -int fk_artisan
    +create() void
    +updateStatus(s: String) void
    +assign(idArtisan: int) void
    +cancel() void
  }

  class Reparation {
    -int id_reparation
    -String description_panne
    -Date date_debut_reparation
    -Date date_fin_reparation
    -float cout_reparation
    -int fk_demande
    +start() void
    +complete() void
    +updateDetails(desc: String, cout: float) void
    +getCost() float
  }

  class Desservice {
    -int id_service
    -String nom_service
    -String description_service
    -float tarif_service
    -int fk_demande
    +create() void
    +update(name: String, tarif: float) void
    +delete() void
    +getDetails() Desservice
  }

  class Paiement {
    -int id_paiement
    -float montant_paiement
    -String methode_paiement
    -String statut_paiement
    -Date date_paiement
    -int fk_demande
    +process() bool
    +cancel() void
    +getStatus() String
    +getReceipt() String
  }

  class Evaluation {
    -int id_evaluation
    -int note_evaluation
    -String commentaire
    -Date date_evaluation
    -int fk_client
    -int fk_demande
    +submit() void
    +update(note: int, comment: String) void
    +delete() void
    +getAvgForArtisan(idA: int) float
  }

  class Metier {
    -int id_metier
    -String nom_metier
    +create(name: String) void
    +update(name: String) void
    +delete() void
    +list() List~Metier~
  }

  class ArtisanMetier {
    -int fk_artisan
    -int fk_metier
    +assign(idA: int, idM: int) void
    +remove(idA: int, idM: int) void
  }

  class RapportFinancier {
    -int id_rapport
    -Date date_generation
    -Date debut_periode
    -Date fin_periode
    -float revenus_totaux
    -float depenses_totaux
    -int nombre_demandes_completees
    -int fk_admin_generateur
    +generate(start: Date, end: Date) void
    +export(format: String) File
    +getRevenues() float
    +getExpenses() float
    +getSummary() String
  }

  %% ─────────────── PYTHON — MINI CHAT APP ───────────────
  class ChatMessage {
    -int id_message
    -int fk_sender
    -String sender_role
    -int fk_demande
    -String content
    -Date sent_at
    -bool is_read
    +send() void
    +markRead() void
    +delete() void
  }

  class ChatConversation {
    -int id_conversation
    -int fk_client
    -int fk_artisan
    -int fk_demande
    -Date created_at
    -bool is_active
    +open() void
    +close() void
    +getMessages() List~ChatMessage~
    +getParticipants() List~String~
    +notifyNewMessage(msg: ChatMessage) void
  }

  class ChatServer {
    -String host
    -int port
    -List~ChatConversation~ activeConversations
    +start() void
    +stop() void
    +authenticate(user: String, token: String) bool
    +routeMessage(msg: ChatMessage) void
    +broadcast(convId: int, msg: ChatMessage) void
    +getConversation(idD: int) ChatConversation
  }

  %% ─────────────── ASSOCIATIONS ───────────────
  Client "1" --> "0..*" Demande : places
  Artisan "0..1" --> "0..*" Demande : is assigned to
  Administrateur "1" --> "0..*" RapportFinancier : generates
  Demande "1" *-- "0..1" Reparation : has (composition)
  Demande "1" *-- "0..1" Paiement : has (composition)
  Demande "1" o-- "0..1" Desservice : references (aggregation)
  Demande "1" *-- "0..1" Evaluation : receives (composition)
  Artisan "1" --> "1..*" ArtisanMetier : has
  Metier "1" --> "1..*" ArtisanMetier : categorises
  Client "1" --> "0..*" ChatConversation : participates in
  Artisan "1" --> "0..*" ChatConversation : participates in
  ChatConversation "1" *-- "0..*" ChatMessage : contains
  ChatServer "1" o-- "0..*" ChatConversation : manages
  Demande "1" --> "0..*" ChatConversation : scoped to
`;

const { svg } = await mermaid.render('cd-svg', diagram);
document.getElementById('cd').innerHTML = svg;

const svgEl = document.querySelector('#cd svg');
if (svgEl) {
  svgEl.style.maxWidth = '100%';
  svgEl.removeAttribute('height');
}
</script>
